spring:
  application:
    name: order-app-back

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}